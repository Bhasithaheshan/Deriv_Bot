<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Accumulator Bot</title>
<style>
:root{--bg:#0e1116;--panel:#171c24;--line:#262d38;--tx:#e6e9ee;--mut:#8a94a3;--up:#2ecc9a;--dn:#ff5c6c;--acc:#f2b84b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 "Trebuchet MS",Verdana,sans-serif}
.app{display:grid;grid-template-columns:320px 1fr;gap:12px;padding:12px;min-height:100vh}
@media(max-width:820px){.app{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px}
h1{font-size:17px;margin:0 0 10px}
label{display:block;color:var(--mut);font-size:12px;margin:10px 0 3px}
input,select{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:6px;padding:8px;font:inherit}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button{width:100%;margin-top:14px;padding:11px;border:0;border-radius:6px;font:inherit;font-weight:700;cursor:pointer;background:var(--up);color:#06231a}
button.stop{background:var(--dn);color:#2b0509}
button.ghost{background:var(--line);color:var(--tx);margin-top:8px}
.stats{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.chip{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:3px 9px;font-variant-numeric:tabular-nums}
.chip.big{border-color:var(--acc);color:var(--acc)}
canvas{width:100%;height:340px;display:block;background:var(--bg);border-radius:6px}
#log{height:200px;overflow:auto;margin-top:10px;font:12px/1.5 Consolas,monospace;color:var(--mut)}
#log .w{color:var(--up)}#log .l{color:var(--dn)}#log .i{color:var(--acc)}
.warn{font-size:11px;color:var(--mut);margin-top:10px}
.pl{font-weight:700}
</style>
</head>
<body>
<div class="app">
<div class="panel">
  <h1>Accumulator Bot</h1>
  <button id="login" class="ghost" style="margin-top:0">Log in with Deriv</button>
  <div id="acctbox" hidden><label>Account</label><select id="acct"></select></div>
  <label>App ID (your registered Deriv app)</label>
  <input id="appid" value="1089">
  <details><summary style="color:var(--mut);margin-top:10px;cursor:pointer">Or use an API token instead</summary>
    <input id="token" type="password" placeholder="Paste token (Read + Trade)" autocomplete="off" style="margin-top:6px">
  </details>
  <div class="row">
    <div><label>Market</label>
      <select id="symbol">
        <option value="R_10">Volatility 10</option><option value="R_25">Volatility 25</option>
        <option value="R_50">Volatility 50</option><option value="R_75">Volatility 75</option>
        <option value="R_100">Volatility 100</option>
      </select></div>
    <div><label>Growth rate</label>
      <select id="growth"><option>1</option><option>2</option><option>3</option><option>4</option><option selected>5</option></select></div>
  </div>
  <div class="row">
    <div><label>Stake (USD)</label><input id="stake" type="number" min="1" step="0.5" value="2"></div>
    <div><label>Target ticks (1-5)</label>
      <select id="target"><option>1</option><option selected>2</option><option>3</option><option>4</option><option>5</option></select></div>
  </div>
  <label>Strategy</label>
  <select id="strategy">
    <option value="hit">Enter right after a barrier hit</option>
    <option value="quiet">Enter after N ticks with no hit</option>
    <option value="streak">Enter after N hits in a row</option>
    <option value="always">Enter every time (no condition)</option>
  </select>
  <label>Strategy value N</label>
  <input id="nval" type="number" min="1" value="3">
  <div class="row">
    <div><label>Stop at profit (USD)</label><input id="tp" type="number" value="5"></div>
    <div><label>Stop at loss (USD)</label><input id="sl" type="number" value="10"></div>
  </div>
  <button id="go">Connect and start</button>
  <button id="stopb" class="ghost" disabled>Stop bot</button>
  <div class="warn">Run this on a demo account first. No strategy removes the risk of losing the full stake on a barrier hit.</div>
</div>

<div class="panel">
  <div class="stats">
    <span class="chip" id="bal">Balance: -</span>
    <span class="chip" id="spot">Spot: -</span>
    <span class="chip big" id="since">Ticks since hit: -</span>
    <span class="chip" id="hits">Hits: 0</span>
    <span class="chip" id="pl">P/L: 0.00</span>
    <span class="chip" id="st">Idle</span>
  </div>
  <div class="stats">Gaps between hits: <span id="gaps" class="chip">-</span></div>
  <canvas id="cv"></canvas>
  <div id="log"></div>
</div>
</div>

<script>
const $=id=>document.getElementById(id);
let ws,running=false,connected=false;
let ticks=[],range=null,since=0,consec=0,hits=0,gaps=[],hitMarks=[];
let lastWasHit=false,pendingEval=false,latestProp=null;
let active=null,ownCount=0,sessionPL=0,sellSent=false;

function log(m,c=''){const d=document.createElement('div');d.className=c;d.textContent=new Date().toLocaleTimeString()+'  '+m;$('log').prepend(d)}
const send=o=>ws&&ws.readyState===1&&ws.send(JSON.stringify(o));

function connect(){
  ws=new WebSocket('wss://ws.derivws.com/websockets/v3?app_id='+encodeURIComponent($('appid').value.trim()));
  ws.onopen=()=>{log('Connected, authorizing...','i');send({authorize:getToken()})};
  ws.onclose=()=>{connected=false;log('Connection closed','l');if(running)stop('Disconnected')};
  ws.onerror=()=>log('WebSocket error','l');
  ws.onmessage=e=>handle(JSON.parse(e.data));
}

function feed(){
  send({forget_all:['ticks','proposal']});
  range=null;since=0;consec=0;ticks=[];hitMarks=[];latestProp=null;
  send({ticks:$('symbol').value,subscribe:1});
  send({proposal:1,subscribe:1,amount:+$('stake').value,basis:'stake',contract_type:'ACCU',currency:'USD',
        symbol:$('symbol').value,growth_rate:+$('growth').value/100});
}

function handle(m){
  if(m.error){log('API: '+m.error.message,'l');if(m.msg_type==='authorize')stop('Auth failed');if(m.msg_type==='buy')active=null;return}
  switch(m.msg_type){
    case'authorize':connected=true;log('Authorized: '+m.authorize.loginid,'w');send({balance:1,subscribe:1});feed();break;
    case'balance':$('bal').textContent='Balance: '+m.balance.balance+' '+m.balance.currency;break;
    case'tick':onTick(m.tick);break;
    case'proposal':onProposal(m.proposal);break;
    case'buy':
      ownCount=0;sellSent=false;
      active={id:m.buy.contract_id,stake:m.buy.buy_price};
      log('Bought #'+m.buy.contract_id+' @ '+m.buy.buy_price,'i');
      send({proposal_open_contract:1,contract_id:active.id,subscribe:1});break;
    case'proposal_open_contract':onContract(m.proposal_open_contract);break;
  }
}

function onTick(t){
  const q=+t.quote;
  let hit=false;
  if(range&&(q>=range.high||q<=range.low))hit=true;
  if(hit){
    hits++;consec++;gaps.unshift(since);gaps=gaps.slice(0,10);since=0;hitMarks.push(ticks.length);
  }else{since++;consec=0}
  lastWasHit=hit;
  ticks.push(q);if(ticks.length>80){ticks.shift();hitMarks=hitMarks.map(i=>i-1).filter(i=>i>=0)}
  if(active)ownCount++;
  pendingEval=true;
  $('spot').textContent='Spot: '+q;
  $('since').textContent='Ticks since hit: '+since;
  $('hits').textContent='Hits: '+hits;
  $('gaps').textContent=gaps.length?gaps.join('  '):'-';
  draw();
}

function onProposal(p){
  const d=p.contract_details;
  if(d){range={high:+d.high_barrier,low:+d.low_barrier}}
  latestProp={id:p.id,price:p.ask_price};
  if(pendingEval){pendingEval=false;evaluate()}
  draw();
}

function signal(){
  const s=$('strategy').value,n=+$('nval').value;
  if(s==='hit')return lastWasHit;
  if(s==='quiet')return since>=n;
  if(s==='streak')return consec>=n;
  return true;
}

function evaluate(){
  if(!running||active||!latestProp)return;
  if(!signal())return;
  log('Signal matched ('+$('strategy').value+') - buying','i');
  active={id:null,stake:latestProp.price};
  send({buy:latestProp.id,price:latestProp.price});
}

function onContract(c){
  if(!active||c.contract_id!==active.id)return;
  const n=c.tick_count!=null?c.tick_count:ownCount;
  $('st').textContent='In trade: '+n+'/'+$('target').value+' ticks, P/L '+(+c.profit).toFixed(2);
  if(c.is_sold||c.status==='sold'||c.status==='won'||c.status==='lost'){
    const p=+c.profit;sessionPL+=p;
    log((p>=0?'WIN ':'LOSS ')+p.toFixed(2)+' ('+(c.exit_tick||'')+')',p>=0?'w':'l');
    $('pl').textContent='P/L: '+sessionPL.toFixed(2);
    send({forget_all:'proposal_open_contract'});
    active=null;
    if(sessionPL>=+$('tp').value)return stop('Profit target reached');
    if(sessionPL<=-Math.abs(+$('sl').value))return stop('Loss limit reached');
    $('st').textContent='Waiting for signal';
    return;
  }
  if(n>=+$('target').value&&c.is_valid_to_sell&&!sellSent){
    sellSent=true;send({sell:c.contract_id,price:0});
  }
}

function start(){
  if(!getToken())return log('Log in with Deriv or paste an API token first','l');
  sessionPL=0;$('pl').textContent='P/L: 0.00';
  running=true;$('go').textContent='Bot running';$('go').classList.add('stop');$('stopb').disabled=false;
  $('st').textContent='Waiting for signal';
  if(!connected){if(!ws||ws.readyState>1)connect()}else feed();
}
function stop(why){
  running=false;$('go').textContent='Connect and start';$('go').classList.remove('stop');$('stopb').disabled=true;
  $('st').textContent='Stopped';log('Bot stopped: '+(why||'manual'),'i');
}
$('go').onclick=()=>{if(!running)start()};
$('stopb').onclick=()=>stop('manual');
['symbol','growth','stake'].forEach(id=>$(id).onchange=()=>{if(connected&&!active)feed()});

function draw(){
  const cv=$('cv'),r=cv.getBoundingClientRect(),dpr=devicePixelRatio||1;
  cv.width=r.width*dpr;cv.height=r.height*dpr;
  const g=cv.getContext('2d');g.scale(dpr,dpr);
  const W=r.width,H=r.height;g.clearRect(0,0,W,H);
  if(ticks.length<2){g.fillStyle='#8a94a3';g.fillText('Waiting for ticks...',14,24);return}
  let lo=Math.min(...ticks),hi=Math.max(...ticks);
  if(range){lo=Math.min(lo,range.low);hi=Math.max(hi,range.high)}
  const pad=(hi-lo)*.1||1;lo-=pad;hi+=pad;
  const X=i=>10+i*(W-90)/(ticks.length-1),Y=v=>H-10-(v-lo)/(hi-lo)*(H-20);
  g.strokeStyle='#e6e9ee';g.lineWidth=1.5;g.beginPath();
  ticks.forEach((v,i)=>i?g.lineTo(X(i),Y(v)):g.moveTo(X(i),Y(v)));g.stroke();
  if(range){
    g.fillStyle='rgba(46,204,154,.10)';g.fillRect(X(ticks.length-1),Y(range.high),W-X(ticks.length-1)-4,Y(range.low)-Y(range.high));
    g.strokeStyle='#4aa3ff';g.setLineDash([4,4]);
    [range.high,range.low].forEach(v=>{g.beginPath();g.moveTo(X(ticks.length-1),Y(v));g.lineTo(W-4,Y(v));g.stroke()});
    g.setLineDash([]);
  }
  g.fillStyle='#ff5c6c';hitMarks.forEach(i=>{g.beginPath();g.arc(X(i),Y(ticks[i]),4,0,7);g.fill()});
  g.fillStyle='#f2b84b';g.beginPath();g.arc(X(ticks.length-1),Y(ticks[ticks.length-1]),4,0,7);g.fill();
}
addEventListener('resize',draw);
let accts=[];
function getToken(){return accts.length?accts[+$('acct').value].token:$('token').value.trim()}
function resetConn(){if(ws)ws.onclose=null,ws.close();connected=false;if(running)stop('Account changed')}
function loadSession(){
  const q=new URLSearchParams(location.search);
  const saved=localStorage.getItem('dappid');if(saved)$('appid').value=saved;
  for(let i=1;q.get('token'+i);i++)accts.push({id:q.get('acct'+i),token:q.get('token'+i),cur:q.get('cur'+i)});
  if(accts.length){sessionStorage.setItem('dacc',JSON.stringify(accts));history.replaceState(null,'',location.pathname)}
  else{try{accts=JSON.parse(sessionStorage.getItem('dacc')||'[]')}catch(e){accts=[]}}
  if(accts.length){
    $('acct').innerHTML=accts.map((a,i)=>`<option value="${i}">${a.id} (${/^VR/i.test(a.id)?'Demo':'REAL'}, ${(a.cur||'').toUpperCase()})</option>`).join('');
    const demo=accts.findIndex(a=>/^VR/i.test(a.id));if(demo>=0)$('acct').value=demo;
    $('acctbox').hidden=false;$('login').textContent='Log out';
    log('Logged in. '+accts.length+' account(s) found. Pick one and press start.','w');
  }
}
$('login').onclick=()=>{
  if(accts.length){sessionStorage.removeItem('dacc');accts=[];resetConn();location.reload();return}
  const id=$('appid').value.trim();if(!id)return log('Enter your App ID first','l');
  localStorage.setItem('dappid',id);
  location.href='https://oauth.deriv.com/oauth2/authorize?app_id='+encodeURIComponent(id);
};
$('acct').onchange=()=>{resetConn();log('Account switched to '+accts[+$('acct').value].id,'i')};
loadSession();

</script>
</body>
</html>
